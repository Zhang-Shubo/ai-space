<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 892" role="img" aria-label="ai-space layered architecture: a unified UI entry over apps, each with agents and widgets; an ai-space core with shared modules; an agent runtime built on Claude Code or Codex; all on one dedicated server.">
  <style>
    svg { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; color: #1c2330; }
    .bg { fill: #ffffff; }
    .layer-app { fill: #e3efe0; stroke: #2b3444; stroke-width: 1.5; }
    .layer-core { fill: #e2e9f6; stroke: #2b3444; stroke-width: 1.5; }
    .layer-runtime { fill: #f6ecd9; stroke: #2b3444; stroke-width: 1.5; }
    .layer-infra { fill: #e9e9ec; stroke: #2b3444; stroke-width: 1.5; }
    .bar-ui { fill: #8fb4d9; stroke: #2b3444; stroke-width: 1.5; }
    .bar-api { fill: #b8b1dc; stroke: #2b3444; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #2b3444; stroke-width: 1.2; }
    .m1 { fill: #f7e3e0; } .m2 { fill: #cfe6cc; } .m3 { fill: #efe2a6; }
    .m4 { fill: #f4d3bd; } .m5 { fill: #dfd0cf; } .m6 { fill: #d3e6e3; }
    .mod { stroke: #2b3444; stroke-width: 1.2; }
    .edge { stroke: #1c2330; stroke-width: 1.6; fill: none; }
    .sep { stroke: #1c2330; stroke-width: 1.2; stroke-dasharray: 8 6; }
    .arrowhead { fill: #1c2330; }
    text { fill: #1c2330; }
    .title { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 600; }
    .title-sm { font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 600; }
    .layer-name { font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 500; font-style: italic; }
    .label { font-size: 14px; font-weight: 500; }
    .label-sm { font-size: 12.5px; }
    .muted { fill: #4a5464; font-size: 12px; }
    .edge-label { font-size: 12px; fill: #4a5464; }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="892"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- ===== Application layer ===== -->
  <text x="1180" y="40" text-anchor="end" class="layer-name">Application Layer</text>
  <rect x="20" y="52" width="1160" height="278" class="layer-app" rx="4"/>
  <text x="40" y="90" class="title">Apps</text>
  <text x="40" y="112" class="muted">one app = one or more agents (pills) + optional widgets (tiles) shown on the panel</text>

  <!-- Unified UI entry bar -->
  <rect x="40" y="128" width="1120" height="42" class="bar-ui" rx="3"/>
  <text x="600" y="155" text-anchor="middle" class="label" style="font-size:16px;font-weight:600">Unified UI Entry &#183; one web panel: app list, chat with any agent, widgets, notifications, settings</text>

  <!-- App boxes -->
  <g>
    <rect x="40" y="188" width="260" height="124" class="chip" rx="4"/>
    <text x="56" y="212" class="label">App A</text>
    <text x="56" y="229" class="muted">e.g. daily briefing</text>
    <rect x="56" y="242" width="110" height="26" class="chip m2 mod" rx="13"/>
    <text x="111" y="259" text-anchor="middle" class="label-sm">Curator</text>
    <rect x="56" y="278" width="110" height="26" class="chip m6 mod" rx="3"/>
    <text x="111" y="295" text-anchor="middle" class="label-sm">Today card</text>
  </g>
  <g>
    <rect x="320" y="188" width="260" height="124" class="chip" rx="4"/>
    <text x="336" y="212" class="label">App B</text>
    <text x="336" y="229" class="muted">e.g. notes &amp; bookmarks</text>
    <rect x="336" y="242" width="110" height="26" class="chip m2 mod" rx="13"/>
    <text x="391" y="259" text-anchor="middle" class="label-sm">Collector</text>
    <rect x="452" y="242" width="110" height="26" class="chip m2 mod" rx="13"/>
    <text x="507" y="259" text-anchor="middle" class="label-sm">Summarizer</text>
    <rect x="336" y="278" width="110" height="26" class="chip m6 mod" rx="3"/>
    <text x="391" y="295" text-anchor="middle" class="label-sm">Search box</text>
    <rect x="452" y="278" width="110" height="26" class="chip m6 mod" rx="3"/>
    <text x="507" y="295" text-anchor="middle" class="label-sm">Recent list</text>
  </g>
  <g>
    <rect x="600" y="188" width="260" height="124" class="chip" rx="4"/>
    <text x="616" y="212" class="label">App C</text>
    <text x="616" y="229" class="muted">e.g. health &amp; habits</text>
    <rect x="616" y="242" width="110" height="26" class="chip m2 mod" rx="13"/>
    <text x="671" y="259" text-anchor="middle" class="label-sm">Coach</text>
    <rect x="616" y="278" width="110" height="26" class="chip m6 mod" rx="3"/>
    <text x="671" y="295" text-anchor="middle" class="label-sm">Streak chart</text>
  </g>
  <g>
    <rect x="880" y="188" width="280" height="124" class="chip" rx="4"/>
    <text x="896" y="212" class="label">App N &#8230;</text>
    <text x="896" y="229" class="muted">any new app registers here</text>
    <rect x="896" y="242" width="110" height="26" class="chip m2 mod" rx="13"/>
    <text x="951" y="259" text-anchor="middle" class="label-sm">Agent 1</text>
    <rect x="1012" y="242" width="110" height="26" class="chip m2 mod" rx="13"/>
    <text x="1067" y="259" text-anchor="middle" class="label-sm">Agent 2 &#8230;</text>
    <rect x="896" y="278" width="110" height="26" class="chip m6 mod" rx="3"/>
    <text x="951" y="295" text-anchor="middle" class="label-sm">Widget 1</text>
    <rect x="1012" y="278" width="110" height="26" class="chip m6 mod" rx="3"/>
    <text x="1067" y="295" text-anchor="middle" class="label-sm">Widget 2 &#8230;</text>
  </g>

  <!-- separator -->
  <line x1="20" y1="350" x2="1180" y2="350" class="sep"/>

  <!-- edges: apps -> core -->
  <line x1="600" y1="330" x2="600" y2="390" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="612" y="372" class="edge-label">app registry &#183; agent routing &#183; auth</text>

  <!-- ===== Space (core) layer ===== -->
  <text x="1180" y="378" text-anchor="end" class="layer-name">Space Layer</text>
  <rect x="20" y="390" width="1160" height="238" class="layer-core" rx="4"/>
  <text x="40" y="430" class="title">ai-space Core</text>
  <text x="40" y="452" class="muted">shared services every app and agent can call, instead of each one building its own</text>

  <rect x="40" y="470" width="1120" height="40" class="bar-api" rx="3"/>
  <text x="600" y="496" text-anchor="middle" class="label" style="font-size:16px;font-weight:600">Space API &#183; one interface for storage, schedule, notify, backup, config</text>

  <!-- module arrows -->
  <g class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="128" y1="510" x2="128" y2="548"/>
    <line x1="317" y1="510" x2="317" y2="548"/>
    <line x1="506" y1="510" x2="506" y2="548"/>
    <line x1="695" y1="510" x2="695" y2="548"/>
    <line x1="884" y1="510" x2="884" y2="548"/>
    <line x1="1073" y1="510" x2="1073" y2="548"/>
  </g>

  <!-- modules -->
  <rect x="53" y="548" width="150" height="62" class="m1 mod" rx="6"/>
  <text x="128" y="574" text-anchor="middle" class="label">Cloud</text>
  <text x="128" y="594" text-anchor="middle" class="label">Storage</text>

  <rect x="242" y="548" width="150" height="62" class="m3 mod" rx="6"/>
  <text x="317" y="574" text-anchor="middle" class="label">Scheduled</text>
  <text x="317" y="594" text-anchor="middle" class="label">Tasks</text>

  <rect x="431" y="548" width="150" height="62" class="m4 mod" rx="6"/>
  <text x="506" y="574" text-anchor="middle" class="label">Notifi-</text>
  <text x="506" y="594" text-anchor="middle" class="label">cations</text>

  <rect x="620" y="548" width="150" height="62" class="m5 mod" rx="6"/>
  <text x="695" y="574" text-anchor="middle" class="label">Data</text>
  <text x="695" y="594" text-anchor="middle" class="label">Backup</text>

  <rect x="809" y="548" width="150" height="62" class="m6 mod" rx="6"/>
  <text x="884" y="574" text-anchor="middle" class="label">Config &amp;</text>
  <text x="884" y="594" text-anchor="middle" class="label">Secrets</text>

  <rect x="998" y="548" width="150" height="62" class="m2 mod" rx="6"/>
  <text x="1073" y="574" text-anchor="middle" class="label">Logs &amp;</text>
  <text x="1073" y="594" text-anchor="middle" class="label">Monitoring</text>

  <!-- separator -->
  <line x1="20" y1="648" x2="1180" y2="648" class="sep"/>

  <!-- edge core -> runtime -->
  <line x1="600" y1="628" x2="600" y2="688" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="612" y="670" class="edge-label">starts agent sessions &#183; agents call the Space API as tools</text>

  <!-- ===== Runtime layer ===== -->
  <text x="1180" y="676" text-anchor="end" class="layer-name">Runtime Layer</text>
  <rect x="20" y="688" width="1160" height="78" class="layer-runtime" rx="4"/>
  <text x="40" y="734" class="title-sm">Agent Runtime</text>
  <rect x="290" y="707" width="170" height="40" class="chip" rx="4"/>
  <text x="375" y="732" text-anchor="middle" class="label">Claude Code</text>
  <rect x="480" y="707" width="170" height="40" class="chip" rx="4"/>
  <text x="565" y="732" text-anchor="middle" class="label">Codex</text>
  <text x="680" y="732" class="muted" style="font-size:13px">skills &#183; MCP tools &#183; memory &#183; LLM access come from the runtime</text>

  <!-- separator -->
  <line x1="20" y1="786" x2="1180" y2="786" class="sep"/>

  <!-- edge runtime -> server -->
  <line x1="600" y1="766" x2="600" y2="826" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ===== Infrastructure layer ===== -->
  <text x="1180" y="814" text-anchor="end" class="layer-name">Infrastructure Layer</text>
  <rect x="20" y="826" width="1160" height="46" class="layer-infra" rx="4"/>
  <text x="40" y="855" class="title-sm">Dedicated Server</text>
  <text x="290" y="855" class="label">Linux host</text>
  <text x="430" y="855" class="label">Bun</text>
  <text x="530" y="855" class="label">SQLite &#183; files</text>
  <text x="700" y="855" class="label">Cron</text>
  <text x="800" y="855" class="label">Network &#183; domain</text>
    </svg>
